name: Tester feedback / UX
description: Confusing workflow, awkward UI, discoverability problem, unnecessary control, or other non-crash feedback
title: "[Feedback] "
body:
  - type: input
    id: version
    attributes:
      label: DUBL version
      placeholder: "0.14.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Operating system / environment
      placeholder: "Windows 11 or CachyOS + KDE Plasma"
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
      description: Describe your goal before describing the UI problem.
      placeholder: "I was trying to add a custom resource and then..."
    validations:
      required: true

  - type: textarea
    id: friction
    attributes:
      label: What was confusing, slow, or awkward?
      placeholder: "I expected the control to be in..., but instead..."
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: What would make this clearer or easier?
      description: Optional. A suggested solution is welcome, but the problem itself is more important.

  - type: textarea
    id: attachments
    attributes:
      label: Screenshot or video
      description: Drag visual examples here when useful.
