name: Bug report
description: Reproducible crash, wrong behavior, data loss, rules/calculation error, or broken UI
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: DUBL version
      description: Use the version shown on the GitHub Release you downloaded.
      placeholder: "0.14.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Linux distro / desktop environment or other environment details
      description: For Linux, include distro and DE/WM if known (for example CachyOS + KDE Plasma + Wayland). Windows users can leave this empty.
      placeholder: "CachyOS, KDE Plasma, Wayland"

  - type: dropdown
    id: character_origin
    attributes:
      label: Character/save type
      options:
        - New character created in this version
        - Existing character created in this version
        - Imported character
        - Migrated/older-version character
        - Happens before opening a character
        - Not sure / not applicable
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Write the shortest sequence that makes the problem happen again.
      placeholder: |
        1. Create/open ...
        2. Set ... to ...
        3. Click ...
        4. The problem appears
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened?
      placeholder: "Describe the actual result, including wrong values or exact visible behavior."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: "Describe the result you expected. For rule/formula bugs, include the expected value if known."
    validations:
      required: true

  - type: dropdown
    id: reproducible
    attributes:
      label: Reproducibility
      options:
        - Every time
        - Often
        - Sometimes
        - Happened once
    validations:
      required: true

  - type: dropdown
    id: new_character
    attributes:
      label: Does it also happen on a newly created character?
      options:
        - Yes
        - No
        - Not tested
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Screenshot, video, or save file
      description: Drag files here when useful. A minimal .dubl save that reproduces the problem can be very helpful; only share files you are comfortable making public.

  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Include workarounds, patterns, or other details that may help reproduce the issue.
