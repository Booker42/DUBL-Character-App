name: Bug report
description: Report a reproducible problem in DUBL Character App
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DUBL version
      placeholder: "0.14.0"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or extra information
