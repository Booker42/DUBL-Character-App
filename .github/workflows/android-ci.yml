name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Test and build development APK
        run: gradle --no-daemon --configuration-cache :app:testDebugUnitTest :app:assemblePreview

      - name: Prepare APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/preview/app-preview.apk out/DUBL-Android-dev.apk

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: DUBL-Android-dev
          path: out/DUBL-Android-dev.apk
          if-no-files-found: error
          retention-days: 14
