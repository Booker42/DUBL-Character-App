name: Android Release

on:
  push:
    tags:
      - "v*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Read version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(\.[0-9]+)?$ ]]; then
            echo "Tag must look like v0.6, v0.6.1, or v0.6.1.1" >&2
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH HOTFIX <<< "$VERSION"
          PATCH="${PATCH:-0}"
          HOTFIX="${HOTFIX:-0}"
          VERSION_CODE=$((10#$MAJOR * 100000000 + 10#$MINOR * 1000000 + 10#$PATCH * 1000 + 10#$HOTFIX))
          echo "DUBL_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "DUBL_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Restore release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "Missing GitHub secret: $name" >&2; exit 1; }
          done
          KEYSTORE="$RUNNER_TEMP/dubl-android-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "DUBL_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "DUBL_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "DUBL_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "DUBL_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Test and build signed release APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          [[ -f "$APK" ]] || { echo "Signed release APK not found" >&2; exit 1; }
          apksigner verify --verbose --print-certs "$APK"
          mkdir -p out
          cp "$APK" "out/DUBL-Android-${DUBL_VERSION_NAME}.apk"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="out/DUBL-Android-${DUBL_VERSION_NAME}.apk"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --verify-tag \
              --title "DUBL Android ${DUBL_VERSION_NAME}" \
              --generate-notes
          fi
